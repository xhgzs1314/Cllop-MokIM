<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>放烟花</title>
    <script src="/ast/3.4.17"></script>
    <link href="/ast/fontawe/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3B82F6',
                        secondary: '#EC4899',
                        dark: '#1E293B',
                    },
                    fontFamily: {
                        inter: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .fireworks-container {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                pointer-events: none;
                z-index: 100;
            }
            .control-panel {
                @apply fixed bottom-4 left-1/2 transform -translate-x-1/2 bg-dark/80 backdrop-blur-md text-white rounded-xl p-4 shadow-lg z-20 flex flex-col sm:flex-row gap-4 items-center w-[90%] max-w-4xl;
            }
            .btn {
                @apply px-4 py-2 rounded-lg font-medium transition-all duration-300 transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-offset-2;
            }
            .btn-primary {
                @apply bg-primary hover:bg-primary/90 text-white focus:ring-primary;
            }
            .btn-secondary {
                @apply bg-secondary hover:bg-secondary/90 text-white focus:ring-secondary;
            }
            .btn-outline {
                @apply border border-white/30 hover:bg-white/10 text-white focus:ring-white;
            }
            .input-field {
                @apply bg-white/10 border border-white/30 rounded-lg px-3 py-2 text-white placeholder-white/60 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent;
            }
        }
    </style>
</head>
<body class="bg-gradient-to-b from-black to-indigo-900 min-h-screen overflow-hidden font-inter">
    <div id="fireworks" class="fireworks-container"></div>
    
    <div class="control-panel">
        <div class="flex items-center gap-2">
            <label for="textInput" class="font-medium">烟花文字:</label>
            <input type="text" id="textInput" placeholder="输入爆炸文字" maxlength="10" 
                class="input-field w-full sm:w-40" value="新年快乐">
        </div>
        
        <div class="flex items-center gap-2">
            <label class="font-medium">烟花样式:</label>
            <div class="flex gap-2">
                <button id="styleBasic" class="btn btn-outline active">基础样式</button>
                <button id="styleHeart" class="btn btn-outline">爱心样式</button>
            </div>
        </div>
        
        <div class="flex items-center gap-2">
            <label class="font-medium">颜色主题:</label>
            <div class="flex gap-2">
                <button data-colors="random" class="theme-btn w-8 h-8 rounded-full bg-gradient-to-r from-red-400 via-green-400 to-blue-400 active"></button>
                <button data-colors="red" class="theme-btn w-8 h-8 rounded-full bg-red-500"></button>
                <button data-colors="blue" class="theme-btn w-8 h-8 rounded-full bg-blue-500"></button>
                <button data-colors="purple" class="theme-btn w-8 h-8 rounded-full bg-purple-500"></button>
            </div>
        </div>
        
        <button id="toggleMusic" class="btn btn-primary">
            <i class="fa fa-music mr-1"></i> 播放音乐
        </button>
    </div>

    <script>
      
        document.addEventListener('DOMContentLoaded', () => {
            const fireworksContainer = document.getElementById('fireworks');
            const textInput = document.getElementById('textInput');
            const styleBasic = document.getElementById('styleBasic');
            const styleHeart = document.getElementById('styleHeart');
            const toggleMusic = document.getElementById('toggleMusic');
            const themeBtns = document.querySelectorAll('.theme-btn');
            
            let activeStyle = 'basic';
            let activeColors = 'random';
            let isMusicPlaying = false;
            let audio = null;
            
        
            const colorThemes = {
                random: ['#FF3366', '#3399FF', '#33FF99', '#FFCC33', '#CC33FF'],
                red: ['#FF3333', '#FF6666', '#FF9999', '#FFCCCC', '#CC0000'],
                blue: ['#3333FF', '#6666FF', '#9999FF', '#CCCCFF', '#0000CC'],
                purple: ['#9933FF', '#AA66FF', '#BB99FF', '#CCBBFF', '#6600CC']
            };
            
      
            function setupAudio() {
                if (!audio) {
                    audio = new Audio();
                    audio.loop = true;
                    audio.src = 'boom1.mp3';
                }
            }
            
          
            toggleMusic.addEventListener('click', () => {
                setupAudio();
                
                if (isMusicPlaying) {
                    audio.pause();
                    toggleMusic.innerHTML = '<i class="fa fa-music mr-1"></i> 播放音乐';
                } else {
                 
                    if (!audio.src) {
                        alert('请先选择音乐！', { icon: 5, time: 1000 });
                        return;
                    }
                    
                    audio.play().catch(e => {
                        console.error('播放音乐失败:', e);
                        alert('请先选择音乐！', { icon: 5, time: 1000 });
                    });
                    toggleMusic.innerHTML = '<i class="fa fa-pause mr-1"></i> 暂停音乐';
                }
                isMusicPlaying = !isMusicPlaying;
            });
            
        
            styleBasic.addEventListener('click', () => {
                activeStyle = 'basic';
                styleBasic.classList.add('btn-primary');
                styleBasic.classList.remove('btn-outline');
                styleHeart.classList.add('btn-outline');
                styleHeart.classList.remove('btn-primary');
            });
            
            styleHeart.addEventListener('click', () => {
                activeStyle = 'heart';
                styleHeart.classList.add('btn-primary');
                styleHeart.classList.remove('btn-outline');
                styleBasic.classList.add('btn-outline');
                styleBasic.classList.remove('btn-primary');
            });
            
         
            themeBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    themeBtns.forEach(b => b.classList.remove('ring-2', 'ring-white', 'ring-offset-2', 'ring-offset-dark'));
                    btn.classList.add('ring-2', 'ring-white', 'ring-offset-2', 'ring-offset-dark');
                    activeColors = btn.dataset.colors;
                });
            });
            
        
            document.addEventListener('click', (e) => {
                if (e.target.closest('.control-panel')) return;
                audio = new Audio();
                audio.src = 'boom1.mp3';
                audio.play().then(() => {
                    audio.remove();
                });
                const x = e.clientX;
                const y = e.clientY;
                createFirework(x, y);
            });
            
    
            function createFirework(x, y) {
                const startX = x;
                const startY = window.innerHeight;
                const endX = x;
                const endY = y;
                
             
                const firework = document.createElement('div');
                firework.className = 'absolute w-2 h-2 bg-white rounded-full';
                firework.style.left = `${startX}px`;
                firework.style.top = `${startY}px`;
                firework.style.zIndex = '101';
                fireworksContainer.appendChild(firework);
                
            
                const duration = 800 + Math.random() * 400;
                let startTime = null;
                
                function animate(timestamp) {
                    if (!startTime) startTime = timestamp;
                    const progress = (timestamp - startTime) / duration;
                    
                    if (progress < 1) {
                        
                        const easeProgress = 1 - Math.pow(1 - progress, 3);
                        const currentX = startX + (endX - startX) * easeProgress;
                        const currentY = startY + (endY - startY) * easeProgress;
                        
                        firework.style.left = `${currentX}px`;
                        firework.style.top = `${currentY}px`;
                        requestAnimationFrame(animate);
                    } else {
                        
                        firework.remove();
                        explode(endX, endY);
                    }
                }
                
                requestAnimationFrame(animate);
            }
            
            
            function explode(x, y) {
                const particlesCount = activeStyle === 'basic' ? 100 : 50;
                const colors = colorThemes[activeColors];
                const text = textInput.value || '新年快乐';
                
                
                if (text) {
                    const textElement = document.createElement('div');
                    textElement.className = 'absolute text-white text-xl font-bold transform -translate-x-1/2 -translate-y-1/2 opacity-0';
                    textElement.style.left = `${x}px`;
                    textElement.style.top = `${y}px`;
                    textElement.style.zIndex = '102';
                    textElement.textContent = text;
                    fireworksContainer.appendChild(textElement);
                    
                    
                    setTimeout(() => {
                        textElement.style.transition = 'opacity 0.8s ease-out, transform 0.8s ease-out';
                        textElement.style.opacity = '1';
                        textElement.style.transform = 'translate(-50%, -50%) scale(1.5)';
                        
                        
                        setTimeout(() => {
                            textElement.style.opacity = '0';
                            textElement.style.transform = 'translate(-50%, -50%) scale(0.5)';
                            
                            setTimeout(() => {
                                textElement.remove();
                            }, 800);
                        }, 800);
                    }, 100);
                }
                
                
                for (let i = 0; i < particlesCount; i++) {
                    const particle = document.createElement('div');
                    
                    if (activeStyle === 'heart' && i % 2 === 0) {
                        
                        particle.className = 'absolute w-4 h-4';
                        particle.style.left = `${x}px`;
                        particle.style.top = `${y}px`;
                        particle.style.zIndex = '101';
                        
                        
                        const heart = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                        heart.setAttribute('viewBox', '0 0 24 24');
                        heart.setAttribute('width', '100%');
                        heart.setAttribute('height', '100%');
                        
                        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                        path.setAttribute('d', 'M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z');
                        path.setAttribute('fill', colors[Math.floor(Math.random() * colors.length)]);
                        
                        heart.appendChild(path);
                        particle.appendChild(heart);
                    } else {
                        
                        particle.className = 'absolute w-2 h-2 rounded-full';
                        particle.style.left = `${x}px`;
                        particle.style.top = `${y}px`;
                        particle.style.zIndex = '101';
                        particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    }
                    
                    fireworksContainer.appendChild(particle);
                    
                    
                    const angle = Math.random() * Math.PI * 2;
                    const speed = 3 + Math.random() * 5;
                    const vx = Math.cos(angle) * speed;
                    const vy = Math.sin(angle) * speed;
                    
                    
                    let startTime = null;
                    const particleDuration = 1000 + Math.random() * 500;
                    
                    function animateParticle(timestamp) {
                        if (!startTime) startTime = timestamp;
                        const progress = (timestamp - startTime) / particleDuration;
                        
                        if (progress < 1) {
                            
                            const easeProgress = 1 - Math.pow(1 - progress, 2);
                            const currentX = x + vx * easeProgress * 15;
                            const currentY = y + vy * easeProgress * 15;
                            const opacity = 1 - progress;
                            
                            particle.style.left = `${currentX}px`;
                            particle.style.top = `${currentY}px`;
                            particle.style.opacity = opacity;
                            
                            requestAnimationFrame(animateParticle);
                        } else {
                            particle.remove();
                        }
                    }
                    
                    requestAnimationFrame(animateParticle);
                }
            }
        });
    </script>
</body>
</html>
