<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安装向导</title>
    <style>
        ::-webkit-scrollbar {
            display: none;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #FF6B6B;
            --secondary: #4ECDC4;
            --accent: #FFD166;
            --light: #FFF8F0;
            --dark: #4A4A4A;
            --step-active: #FF6B6B;
            --step-complete: #4ECDC4;
            --step-inactive: #E0E0E0;
        }

        body {
            font-family: 'Segoe UI', Meiryo, 'Microsoft YaHei', sans-serif;
            background-color: var(--light);
            background-image:
                radial-gradient(circle at 10% 20%, rgba(255, 107, 107, 0.05) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(78, 205, 196, 0.05) 0%, transparent 20%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: white;
            border-radius: 24px;
            padding: 40px 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(255, 107, 107, 0.1);
            position: relative;
            overflow: hidden;
        }

        .container::before,
        .container::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            opacity: 0.15;
            z-index: 0;
        }

        .container::before {
            width: 80px;
            height: 80px;
            top: -20px;
            right: -20px;
            background: var(--accent);
        }

        .container::after {
            width: 100px;
            height: 100px;
            bottom: -30px;
            left: -30px;
            background: var(--primary);
        }

   
        .steps-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
            position: relative;
            z-index: 1;
        }

        .steps-bar::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 30px;
            right: 30px;
            height: 3px;
            background: var(--step-inactive);
            transform: translateY(-50%);
            z-index: 0;
        }

        .step-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 1;
            flex: 1;
        }

        .step-circle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--step-inactive);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 16px;
            transition: all 0.4s ease;
            cursor: default;
        }

        .step-item.active .step-circle {
            background: var(--step-active);
            box-shadow: 0 0 0 4px rgba(255, 107, 107, 0.2);
            transform: scale(1.05);
        }

        .step-item.complete .step-circle {
            background: var(--step-complete);
        }

        .step-label {
            margin-top: 8px;
            font-size: 13px;
            color: #999;
            transition: color 0.3s;
            text-align: center;
        }

        .step-item.active .step-label {
            color: var(--step-active);
            font-weight: 600;
        }

        .step-item.complete .step-label {
            color: var(--step-complete);
        }

       
        .step-panel {
            position: relative;
            z-index: 1;
        }

        .step-page {
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .step-page.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .step-page h2 {
            text-align: center;
            margin-bottom: 10px;
            color: var(--dark);
            font-size: 22px;
        }

        .step-page .subtitle {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 25px;
        }

     
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            color: #555;
            font-size: 14px;
        }

        .form-group input[type="text"],
        .form-group input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e8e8e8;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.3s ease;
            background: #fafafa;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(255, 107, 107, 0.1);
            background: white;
        }

        .form-group .hint {
            font-size: 12px;
            color: #aaa;
            margin-top: 4px;
        }

     
        .btn-row {
            display: flex;
            gap: 12px;
            margin-top: 25px;
            justify-content: center;
        }

        .btn {
            padding: 12px 36px;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), #FF4757);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #555;
        }

        .btn-secondary:hover {
            background: #e5e5e5;
        }

        .btn-success {
            background: linear-gradient(135deg, var(--secondary), #36B5AD);
            color: white;
            box-shadow: 0 4px 15px rgba(78, 205, 196, 0.3);
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(78, 205, 196, 0.4);
        }

       
        .complete-icon {
            text-align: center;
            font-size: 64px;
            margin: 10px 0 20px;
        }

        .complete-icon .check {
            display: inline-block;
            width: 80px;
            height: 80px;
            line-height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--secondary), #36B5AD);
            color: white;
            font-size: 40px;
        }

        .complete-info {
            text-align: center;
            margin: 20px 0;
            padding: 15px;
            background: #f8f8f8;
            border-radius: 12px;
            font-size: 14px;
            color: #666;
        }

        .complete-info strong {
            color: var(--dark);
        }

        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .btn-group .btn {
            min-width: 140px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
        }

        .notice-box {
            margin-top: 20px;
            padding: 14px 18px;
            background: #FFF0F0;
            border-radius: 12px;
            border-left: 4px solid var(--primary);
            font-size: 13px;
            color: #888;
            text-align: center;
        }

     
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

    
        @media (max-width: 480px) {
            .container {
                padding: 25px 16px;
            }
            .step-circle {
                width: 32px;
                height: 32px;
                font-size: 13px;
            }
            .step-label {
                font-size: 11px;
            }
            .btn {
                padding: 10px 20px;
                font-size: 14px;
            }
            .btn-group .btn {
                min-width: 100px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
     
        <div class="steps-bar" id="stepsBar">
            <div class="step-item active" data-step="1">
                <div class="step-circle">1</div>
                <span class="step-label">数据库</span>
            </div>
            <div class="step-item" data-step="2">
                <div class="step-circle">2</div>
                <span class="step-label">配置</span>
            </div>
            <div class="step-item" data-step="3">
                <div class="step-circle">3</div>
                <span class="step-label">完成</span>
            </div>
        </div>

   
        <div class="step-panel">

        
            <div class="step-page active" id="page1">
                <h2>数据库配置</h2>
                <p class="subtitle">请填写您的 MySQL 数据库连接信息</p>
                <form id="dbForm">
                    <div class="form-group">
                        <label>数据库主机</label>
                        <input type="text" id="dbHost" value="localhost" placeholder="例如: localhost 或 127.0.0.1">
                    </div>
                    <div class="form-group">
                        <label>数据库名称</label>
                        <input type="text" id="dbName" placeholder="请输入数据库名">
                    </div>
                    <div class="form-group">
                        <label>用户名</label>
                        <input type="text" id="dbUsername" placeholder="数据库用户名">
                    </div>
                    <div class="form-group">
                        <label>密码</label>
                        <input type="password" id="dbPassword" placeholder="数据库密码">
                    </div>
                    <div class="form-group">
                        <label>后台地址</label>
                        <input type="text" id="adminAddress" value="mokim-admin" placeholder="后台目录名">
                        <div class="hint">⚠️ 建议修改为自定义名称，提高安全性</div>
                    </div>
                    <div class="btn-row">
                        <button type="button" class="btn btn-primary" id="btnStep1">下一步 →</button>
                    </div>
                </form>
            </div>

        
            <div class="step-page" id="page2">
                <h2>⚙️ 确认安装</h2>
                <p class="subtitle">请确认以下信息无误，点击安装开始导入数据</p>
                <div style="background:#f8f8f8;border-radius:12px;padding:16px;font-size:14px;color:#555;line-height:1.8;margin-bottom:10px;">
                    <div><strong>数据库主机：</strong><span id="confirmHost">-</span></div>
                    <div><strong>数据库名称：</strong><span id="confirmName">-</span></div>
                    <div><strong>用户名：</strong><span id="confirmUser">-</span></div>
                    <div><strong>后台地址：</strong><span id="confirmAdmin">-</span></div>
                </div>
                <div class="btn-row">
                    <button type="button" class="btn btn-secondary" id="btnBack1">← 上一步</button>
                    <button type="button" class="btn btn-success" id="btnInstall">🚀 开始安装</button>
                </div>
                <div id="installStatus" style="text-align:center;margin-top:15px;font-size:14px;color:#888;display:none;">
                    <span class="spinner"></span> 正在安装，请稍候...
                </div>
            </div>

          
            <div class="step-page" id="page3">
                <div class="complete-icon">
                    <span class="check">✓</span>
                </div>
                <h2>✨ 安装完成！</h2>
                <p class="subtitle">熙鹤-在线聊天-XPAX 已成功安装</p>

                <div class="complete-info">
                    <div><strong>后台账号：</strong> admin</div>
                    <div><strong>后台密码：</strong> admin123</div>
                    <div style="margin-top:6px;font-size:13px;color:#999;">请及时修改默认密码</div>
                </div>

                <div class="btn-group">
                    <a href="/" class="btn btn-secondary"> 前往首页</a>
                    <a href="/admin/" class="btn btn-primary" id="adminLink"> 前往后台</a>
                </div>

                <div class="notice-box">
                    安装完成后请删除 <strong>install</strong> 文件夹，否则后果自负！
                </div>

                <div style="text-align:center;margin-top:15px;">
                    <button type="button" class="btn btn-secondary" style="font-size:13px;padding:8px 20px;" onclick="location.reload();">🔄 重新安装</button>
                </div>
            </div>

        </div>
    </div>

    <script>
        (function() {
            'use strict';

        
            const pages = {
                1: document.getElementById('page1'),
                2: document.getElementById('page2'),
                3: document.getElementById('page3')
            };
            const steps = document.querySelectorAll('.step-item');
            const btnStep1 = document.getElementById('btnStep1');
            const btnBack1 = document.getElementById('btnBack1');
            const btnInstall = document.getElementById('btnInstall');
            const installStatus = document.getElementById('installStatus');
            const dbHost = document.getElementById('dbHost');
            const dbName = document.getElementById('dbName');
            const dbUsername = document.getElementById('dbUsername');
            const dbPassword = document.getElementById('dbPassword');
            const adminAddress = document.getElementById('adminAddress');
            const confirmHost = document.getElementById('confirmHost');
            const confirmName = document.getElementById('confirmName');
            const confirmUser = document.getElementById('confirmUser');
            const confirmAdmin = document.getElementById('confirmAdmin');
            let currentStep = 1;
            let isInstalling = false;
            function goToStep(step) {
                Object.values(pages).forEach(p => p.classList.remove('active'));
                if (pages[step]) pages[step].classList.add('active');
                steps.forEach((item, index) => {
                    const num = index + 1;
                    item.classList.remove('active', 'complete');
                    if (num < step) item.classList.add('complete');
                    else if (num === step) item.classList.add('active');
                });

                currentStep = step;
            }
            btnStep1.addEventListener('click', function() {
                const host = dbHost.value.trim();
                const name = dbName.value.trim();
                const user = dbUsername.value.trim();
                const pass = dbPassword.value.trim();
                const admin = adminAddress.value.trim();

                if (!host || !name || !user || !pass || !admin) {
                    alert('所有字段都必须填写！');
                    return;
                }
                confirmHost.textContent = host;
                confirmName.textContent = name;
                confirmUser.textContent = user;
                confirmAdmin.textContent = admin;
                goToStep(2);
            });

          
            btnBack1.addEventListener('click', function() {
                goToStep(1);
                installStatus.style.display = 'none';
                btnInstall.disabled = false;
                btnInstall.textContent = '🚀 开始安装';
            });

           
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    if (currentStep === 1) btnStep1.click();
                    else if (currentStep === 2 && !btnInstall.disabled) btnInstall.click();
                }
            });

          
            btnInstall.addEventListener('click', function() {
                if (isInstalling) return;

                const host = dbHost.value.trim();
                const name = dbName.value.trim();
                const user = dbUsername.value.trim();
                const pass = dbPassword.value.trim();
                const admin = adminAddress.value.trim();

                if (!host || !name || !user || !pass || !admin) {
                    alert('数据不完整，请返回上一步重新填写。');
                    return;
                }

            
                isInstalling = true;
                btnInstall.disabled = true;
                btnInstall.textContent = '⏳ 安装中...';
                installStatus.style.display = 'block';

                const xhr = new XMLHttpRequest();
                xhr.open('POST', 'call.php', true);
                xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');

                xhr.onreadystatechange = function() {
                    if (xhr.readyState === 4) {
                        isInstalling = false;
                        btnInstall.disabled = false;
                        installStatus.style.display = 'none';

                        if (xhr.status === 200) {
                            const resp = xhr.responseText.trim();
                            if (resp.includes('success')) {
                                document.cookie = 'loginperson=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
                                document.cookie = 'installilon=value; expires=Fri, 31 Dec 2033 23:59:59 GMT; path=/';
                                goToStep(3);
                                const adminLink = document.getElementById('adminLink');
                                const adminPath = admin || 'mokim-admin';
                                adminLink.href = '/' + adminPath + '/';
                            } else {
                                alert('安装失败：\n' + resp);
                                btnInstall.textContent = '🚀 重试安装';
                            }
                        } else {
                            alert('请求发生错误 (HTTP ' + xhr.status + ')\n请检查网络或服务器配置。');
                            btnInstall.textContent = '🚀 重试安装';
                        }
                    }
                };

                xhr.onerror = function() {
                    isInstalling = false;
                    btnInstall.disabled = false;
                    installStatus.style.display = 'none';
                    alert('网络请求失败，请检查服务器是否可访问。');
                    btnInstall.textContent = '🚀 重试安装';
                };
                const params =
                    'dbHost=' + encodeURIComponent(host) +
                    '&dbName=' + encodeURIComponent(name) +
                    '&dbUsername=' + encodeURIComponent(user) +
                    '&dbPassword=' + encodeURIComponent(pass) +
                    '&adminadress=' + encodeURIComponent(admin);

                xhr.send(params);
            });
            goToStep(1);
        })();
    </script>

</body>
</html>
